<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>테스트용 일지 | Minari</title>
  <style>
    :root {
      --bg: #ffffff;
      --paper: rgba(255, 255, 252, 0.9);
      --ink: #20211f;
      --muted: #4f544d;
      --line: rgba(32, 33, 31, 0.12);
      --accent-deep: #1f4f43;
      --shadow: 0 24px 60px rgba(31, 41, 36, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(116, 186, 220, 0.24) 1px, transparent 1px),
        linear-gradient(90deg, rgba(116, 186, 220, 0.24) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    main {
      position: relative;
      width: min(640px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 52px;
    }

    .back-link {
      display: inline-flex;
      margin-bottom: 20px;
      color: var(--accent-deep);
      font-size: 0.95rem;
      font-weight: 800;
      text-decoration: none;
    }

    .back-link::before { content: "← "; }

    article {
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    time {
      color: var(--accent-deep);
      font-size: 0.84rem;
      font-weight: 800;
    }

    h1 {
      margin: 10px 0 24px;
      font-size: clamp(2rem, 7vw, 2.7rem);
      line-height: 1.12;
      letter-spacing: -0.03em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main>
    <a class="back-link" href="../index.html#journal">일지 목록으로 돌아가기</a>
    <article>
      <time datetime="2026-08-12">2026. 08. 12</time>
      <h1>테스트용 일지</h1>
      <p>안녕 이건 테스트용 일지야</p>
    </article>
  </main>
</body>
</html>
