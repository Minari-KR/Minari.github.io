    <section class="section release" id="release" aria-labelledby="release-title">
      <h2 class="section-title" id="release-title"><span class="marker">출시 앱</span></h2>
      <article class="project release-app" aria-labelledby="release-app-title">
        <img class="release-image{{image_class}}" src="./{{image}}" width="{{image_width}}" height="{{image_height}}" alt="">
        <p class="release-status">{{status}}</p>
        <h3 class="project-title" id="release-app-title"><span translate="no">{{title}}</span></h3>
        <p class="project-meta">{{meta}}</p>
{{actions}}      </article>
    </section>
