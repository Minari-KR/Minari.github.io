<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{security}}
  <title>Mobile Preview | Minari</title>
  <link rel="stylesheet" href="./assets/css/preview.css">
</head>
<body>
  <main class="page">
    <div class="toolbar">
      <button data-size="w390" class="active">iPhone 12 (390x844)</button>
      <button data-size="w412">Pixel 7 (412x915)</button>
      <button data-size="w360">Galaxy S8+ (360x800)</button>
      <button data-size="w320">작은 화면 (320x740)</button>
      <button id="reload">새로고침</button>
      <label class="page-select" for="pageSelect">
        <span>페이지</span>
        <select id="pageSelect">
          <option value="./index.html">홈</option>
{{journal_options}}
        </select>
      </label>
      <span class="hint">저장 후 `새로고침` 클릭</span>
    </div>

    <div class="grid">
      <section class="frame-card">
        <h1 class="frame-title">모바일 미리보기</h1>
        <div id="phoneA" class="phone w390">
          <iframe id="frameA" src="./index.html" title="모바일 페이지 미리보기"></iframe>
        </div>
      </section>
    </div>
  </main>

  <script src="./assets/js/preview.js" defer></script>
</body>
</html>
